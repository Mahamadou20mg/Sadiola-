name: SADIOLA SUGU Android

on:
  push:
    branches:
      - apk-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
        with:
          ref: apk-android

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Installer les dependances
        run: npm ci

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK dans GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: sadiola-apk
          name: SADIOLA SUGU - Derniere version
          body: Nouvelle version de SADIOLA SUGU.
          commit: ${{ github.sha }}
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
